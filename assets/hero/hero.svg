<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1600 1100"
     width="1600"
     height="1100">

  <defs>

    <!-- Background image -->
    <image id="heroImage"
           xlink:href="hero.jpg"
           width="1600"
           height="1100"
           preserveAspectRatio="xMidYMid slice"/>

    <!-- Pink atmospheric glow -->
    <radialGradient id="pinkGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffb6d9" stop-opacity="0.72"/>
      <stop offset="35%" stop-color="#ff77b7" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#d9468d" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Dark readability layer -->
    <linearGradient id="darkOverlay"
                    x1="0" y1="0"
                    x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Pink wash -->
    <linearGradient id="pinkWash"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4fa3" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#ff8ac5" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#9d174d" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Glass panel -->
    <linearGradient id="glass"
                    x1="0" y1="0"
                    x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.13"/>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <!-- Text shadow -->
    <filter id="textShadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">
      <feDropShadow dx="0"
                    dy="5"
                    stdDeviation="5"
                    flood-color="#ffffff"
                    flood-opacity="0.65"/>
    </filter>

    <!-- Moving light -->
    <linearGradient id="lightBeam">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffb6d9" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="roundedClip">
      <rect x="15" y="15"
            width="1570"
            height="1070"
            rx="42"/>
    </clipPath>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <g clip-path="url(#roundedClip)">

    <use xlink:href="#heroImage"/>

    <!-- Dark readability -->
    <rect x="0" y="0"
          width="1600"
          height="1100"
          fill="url(#darkOverlay)"/>

    <!-- Pink lighting -->
    <rect x="0" y="0"
          width="1600"
          height="1100"
          fill="url(#pinkWash)"/>

    <rect x="0" y="0"
          width="1600"
          height="850"
          fill="url(#pinkGlow)"
          filter="url(#softBlur)">
      <animate attributeName="opacity"
               values="0.65;1;0.65"
               dur="7s"
               repeatCount="indefinite"/>
    </rect>


    <!-- Large atmospheric pink glow -->
    <ellipse cx="800"
             cy="250"
             rx="520"
             ry="250"
             fill="#ff69b4"
             opacity="0.12"
             filter="url(#glow)">
      <animate attributeName="rx"
               values="480;560;480"
               dur="8s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values="0.08;0.20;0.08"
               dur="8s"
               repeatCount="indefinite"/>
    </ellipse>


    <!-- ================================================= -->
    <!-- TITLE -->
    <!-- ================================================= -->

    <text x="800"
          y="145"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="67"
          font-weight="900"
          fill="#050505"
          filter="url(#textShadow)">

      Biomedical &amp; Health Informatics Lab

      <!-- subtle floating movement -->
      <animateTransform
          attributeName="transform"
          type="translate"
          values="0 0; 0 -4; 0 0"
          dur="5s"
          repeatCount="indefinite"/>
    </text>


    <!-- ================================================= -->
    <!-- SUBTITLE -->
    <!-- ================================================= -->

    <text x="800"
          y="210"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="29"
          font-weight="700"
          letter-spacing="1"
          fill="#050505"
          filter="url(#textShadow)">

      Health × Computer Science × Data × AI × Research

      <animate attributeName="opacity"
               values="0.82;1;0.82"
               dur="4s"
               repeatCount="indefinite"/>
    </text>


    <!-- ================================================= -->
    <!-- DESCRIPTION -->
    <!-- ================================================= -->

    <text x="800"
          y="270"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="20"
          font-weight="600"
          fill="#080808">

      <tspan x="800" dy="0">
        An interdisciplinary research laboratory at the intersection
      </tspan>

      <tspan x="800" dy="30">
        of health sciences, computer science, data, artificial intelligence,
      </tspan>

      <tspan x="800" dy="30">
        digital health, and responsible technology.
      </tspan>

    </text>


    <!-- ================================================= -->
    <!-- MAIN BADGES -->
    <!-- ================================================= -->

    <!-- Research -->
    <rect x="235" y="355"
          width="190" height="45"
          rx="22"
          fill="#ffffff"
          fill-opacity="0.72"
          stroke="#6A5ACD"
          stroke-width="2"/>

    <text x="330" y="384"
          text-anchor="middle"
          font-family="Arial"
          font-size="17"
          font-weight="800"
          fill="#111">
      🔬 Research • Interdisciplinary
    </text>


    <!-- Health Informatics -->
    <rect x="445" y="355"
          width="225" height="45"
          rx="22"
          fill="#ffffff"
          fill-opacity="0.72"
          stroke="#00A6A6"
          stroke-width="2"/>

    <text x="557" y="384"
          text-anchor="middle"
          font-family="Arial"
          font-size="17"
          font-weight="800"
          fill="#111">
      🧬 Health • Informatics
    </text>


    <!-- Computer Science -->
    <rect x="690" y="355"
          width="215" height="45"
          rx="22"
          fill="#ffffff"
          fill-opacity="0.72"
          stroke="#3776AB"
          stroke-width="2"/>

    <text x="797" y="384"
          text-anchor="middle"
          font-family="Arial"
          font-size="17"
          font-weight="800"
          fill="#111">
      💻 Computer • Science
    </text>


    <!-- AI -->
    <rect x="925" y="355"
          width="135" height="45"
          rx="22"
          fill="#ffffff"
          fill-opacity="0.72"
          stroke="#FF6F00"
          stroke-width="2"/>

    <text x="992" y="384"
          text-anchor="middle"
          font-family="Arial"
          font-size="17"
          font-weight="800"
          fill="#111">
      🤖 AI
    </text>


    <!-- Responsible AI -->
    <rect x="1080" y="355"
          width="230" height="45"
          rx="22"
          fill="#ffffff"
          fill-opacity="0.72"
          stroke="#7B61FF"
          stroke-width="2"/>

    <text x="1195" y="384"
          text-anchor="middle"
          font-family="Arial"
          font-size="17"
          font-weight="800"
          fill="#111">
      🛡️ Responsible AI
    </text>


    <!-- ================================================= -->
    <!-- STATUS BADGES -->
    <!-- ================================================= -->

    <rect x="335" y="425"
          width="250"
          height="38"
          rx="19"
          fill="#ffffff"
          fill-opacity="0.62"/>

    <text x="460" y="450"
          text-anchor="middle"
          font-family="Arial"
          font-size="15"
          font-weight="700"
          fill="#111">
      STATUS • FOUNDATIONAL DEVELOPMENT
    </text>


    <rect x="600" y="425"
          width="285"
          height="38"
          rx="19"
          fill="#ffffff"
          fill-opacity="0.62"/>

    <text x="742" y="450"
          text-anchor="middle"
          font-family="Arial"
          font-size="15"
          font-weight="700"
          fill="#111">
      FOCUS • HEALTH × CS × DATA × AI
    </text>


    <rect x="900" y="425"
          width="230"
          height="38"
          rx="19"
          fill="#ffffff"
          fill-opacity="0.62"/>

    <text x="1015" y="450"
          text-anchor="middle"
          font-family="Arial"
          font-size="15"
          font-weight="700"
          fill="#111">
      REPRODUCIBLE • EVIDENCE-BASED
    </text>


    <!-- ================================================= -->
    <!-- RESEARCH FLOW PANEL -->
    <!-- ================================================= -->

    <rect x="190"
          y="505"
          width="1220"
          height="470"
          rx="35"
          fill="url(#glass)"
          stroke="#ffffff"
          stroke-opacity="0.50"
          stroke-width="2"/>


    <text x="800"
          y="555"
          text-anchor="middle"
          font-family="Arial"
          font-size="22"
          font-weight="900"
          letter-spacing="4"
          fill="#050505">

      RESEARCH ARCHITECTURE

    </text>


    <!-- Health -->

    <rect x="540" y="590"
          width="520"
          height="48"
          rx="24"
          fill="#ffffff"
          fill-opacity="0.78"/>

    <text x="800" y="622"
          text-anchor="middle"
          font-family="Arial"
          font-size="20"
          font-weight="800"
          fill="#050505">
      🧬 HEALTH
    </text>


    <text x="800"
          y="665"
          text-anchor="middle"
          font-size="28"
          font-family="Arial"
          font-weight="900"
          fill="#d9468d">
      ↓
    </text>


    <!-- Computer Science -->

    <rect x="540" y="680"
          width="520"
          height="48"
          rx="24"
          fill="#ffffff"
          fill-opacity="0.78"/>

    <text x="800" y="712"
          text-anchor="middle"
          font-family="Arial"
          font-size="20"
          font-weight="800"
          fill="#050505">
      💻 COMPUTER SCIENCE
    </text>


    <text x="800"
          y="755"
          text-anchor="middle"
          font-size="28"
          font-family="Arial"
          font-weight="900"
          fill="#d9468d">
      ↓
    </text>


    <!-- Data -->

    <rect x="540" y="770"
          width="520"
          height="48"
          rx="24"
          fill="#ffffff"
          fill-opacity="0.78"/>

    <text x="800" y="802"
          text-anchor="middle"
          font-family="Arial"
          font-size="20"
          font-weight="800"
          fill="#050505">
      📊 DATA &amp; STATISTICS
    </text>


    <text x="800"
          y="845"
          text-anchor="middle"
          font-size="28"
          font-family="Arial"
          font-weight="900"
          fill="#d9468d">
      ↓
    </text>


    <!-- AI -->

    <rect x="540" y="860"
          width="520"
          height="48"
          rx="24"
          fill="#ffffff"
          fill-opacity="0.78"/>

    <text x="800" y="892"
          text-anchor="middle"
          font-family="Arial"
          font-size="20"
          font-weight="800"
          fill="#050505">
      🤖 ARTIFICIAL INTELLIGENCE
    </text>


    <!-- ================================================= -->
    <!-- ANIMATED LIGHT SWEEP -->
    <!-- ================================================= -->

    <rect x="-500"
          y="0"
          width="300"
          height="1100"
          fill="url(#lightBeam)"
          opacity="0.22"
          transform="skewX(-15)">

      <animate attributeName="x"
               from="-500"
               to="1800"
               dur="9s"
               repeatCount="indefinite"/>
    </rect>


    <!-- Floating particles -->

    <circle cx="170" cy="180" r="4"
            fill="#ff69b4">
      <animate attributeName="cy"
               values="180;155;180"
               dur="5s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values="0.2;1;0.2"
               dur="5s"
               repeatCount="indefinite"/>
    </circle>


    <circle cx="1430" cy="250" r="5"
            fill="#ff9dcc">
      <animate attributeName="cy"
               values="250;220;250"
               dur="6s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values="0.15;0.9;0.15"
               dur="6s"
               repeatCount="indefinite"/>
    </circle>


    <circle cx="1320" cy="520" r="3"
            fill="#ffffff">
      <animate attributeName="opacity"
               values="0.1;1;0.1"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ===================================================== -->
  <!-- PREMIUM BORDER -->
  <!-- ===================================================== -->

  <rect x="15"
        y="15"
        width="1570"
        height="1070"
        rx="42"
        fill="none"
        stroke="#ff9dcc"
        stroke-opacity="0.75"
        stroke-width="3"/>

  <rect x="25"
        y="25"
        width="1550"
        height="1050"
        rx="35"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.35"
        stroke-width="1"/>

</svg>

