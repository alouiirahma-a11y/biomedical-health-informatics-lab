<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1600 720">

  <defs>

    <!-- Pink atmospheric glow -->
    <radialGradient id="pinkGlow"
                    cx="50%"
                    cy="45%"
                    r="70%">

      <stop offset="0%"
            stop-color="#ff9ed1"
            stop-opacity="0.70"/>

      <stop offset="45%"
            stop-color="#f45cab"
            stop-opacity="0.30"/>

      <stop offset="100%"
            stop-color="#d51b7b"
            stop-opacity="0"/>

    </radialGradient>


    <!-- Soft pink color wash -->
    <linearGradient id="pinkWash"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0%"
            stop-color="#ffd7eb"
            stop-opacity="0.30"/>

      <stop offset="50%"
            stop-color="#ff69b5"
            stop-opacity="0.15"/>

      <stop offset="100%"
            stop-color="#a91667"
            stop-opacity="0.30"/>

    </linearGradient>


    <!-- Dark cinematic overlay -->
    <linearGradient id="darkOverlay"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">

      <stop offset="0%"
            stop-color="#000000"
            stop-opacity="0.08"/>

      <stop offset="50%"
            stop-color="#000000"
            stop-opacity="0.12"/>

      <stop offset="100%"
            stop-color="#000000"
            stop-opacity="0.25"/>

    </linearGradient>


    <!-- Blur -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>


    <!-- Text shadow -->
    <filter id="textShadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%">

      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="5"
        flood-color="#ffffff"
        flood-opacity="0.85"/>

    </filter>


    <!-- Rounded hero area -->
    <clipPath id="heroClip">

      <rect
        x="12"
        y="12"
        width="1576"
        height="696"
        rx="38"/>

    </clipPath>

  </defs>


  <!-- ================================================= -->
  <!-- HERO -->
  <!-- ================================================= -->

  <g clip-path="url(#heroClip)">


    <!-- YOUR ORIGINAL HERO IMAGE -->
    <image
      x="0"
      y="0"
      width="1600"
      height="720"
      preserveAspectRatio="xMidYMid slice"
      xlink:href="hero.jpg"/>


    <!-- PINK LIGHTING -->
    <rect
      x="0"
      y="0"
      width="1600"
      height="720"
      fill="url(#pinkWash)"/>


    <!-- DARK CINEMATIC OVERLAY -->
    <rect
      x="0"
      y="0"
      width="1600"
      height="720"
      fill="url(#darkOverlay)"/>


    <!-- LARGE SOFT PINK GLOW -->
    <ellipse
      cx="800"
      cy="350"
      rx="560"
      ry="310"
      fill="url(#pinkGlow)"
      filter="url(#blur)">

      <animate
        attributeName="opacity"
        values="0.45;0.80;0.45"
        dur="7s"
        repeatCount="indefinite"/>

      <animateTransform
        attributeName="transform"
        type="scale"
        values="1;1.045;1"
        dur="7s"
        repeatCount="indefinite"/>

    </ellipse>


    <!-- ================================================= -->
    <!-- SLOW LIGHT SWEEP -->
    <!-- ================================================= -->

    <rect
      x="-450"
      y="-50"
      width="280"
      height="820"
      fill="#ffffff"
      opacity="0.08"
      transform="skewX(-13)">

      <animate
        attributeName="x"
        values="-450;1800"
        dur="12s"
        repeatCount="indefinite"/>

    </rect>


    <!-- ================================================= -->
    <!-- MAIN TEXT -->
    <!-- ================================================= -->

    <g
      transform="translate(800 275)"
      text-anchor="middle"
      fill="#080609"
      filter="url(#textShadow)">


      <!-- MAIN TITLE -->

      <text
        x="0"
        y="0"
        font-family="Arial, Helvetica, sans-serif"
        font-size="60"
        font-weight="800"
        letter-spacing="-1.5">

        Biomedical &amp; Health Informatics Lab

        <animate
          attributeName="opacity"
          values="0;1"
          dur="1.5s"
          fill="freeze"/>

      </text>


      <!-- SUBTITLE -->

      <text
        x="0"
        y="70"
        font-family="Arial, Helvetica, sans-serif"
        font-size="27"
        font-weight="600"
        letter-spacing="2">

        Health × Computer Science × Data × AI × Research

        <animate
          attributeName="opacity"
          values="0;1"
          dur="1.3s"
          begin="0.6s"
          fill="freeze"/>

      </text>


      <!-- RESEARCH AREAS -->

      <text
        x="0"
        y="120"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        font-weight="700"
        letter-spacing="3">

        BIOMEDICAL INFORMATICS • DIGITAL HEALTH • RESPONSIBLE AI

        <animate
          attributeName="opacity"
          values="0;1"
          dur="1.2s"
          begin="1.1s"
          fill="freeze"/>

      </text>

    </g>


    <!-- ================================================= -->
    <!-- RESEARCH SIGNAL -->
    <!-- ================================================= -->

    <g
      transform="translate(800 505)"
      fill="#080609">


      <!-- LEFT DOT -->

      <circle
        cx="-90"
        cy="0"
        r="4">

        <animate
          attributeName="r"
          values="3;6;3"
          dur="2.8s"
          repeatCount="indefinite"/>

        <animate
          attributeName="opacity"
          values="0.35;1;0.35"
          dur="2.8s"
          repeatCount="indefinite"/>

      </circle>


      <!-- CENTER DOT -->

      <circle
        cx="0"
        cy="0"
        r="4">

        <animate
          attributeName="r"
          values="3;6;3"
          dur="2.8s"
          begin="0.45s"
          repeatCount="indefinite"/>

        <animate
          attributeName="opacity"
          values="0.35;1;0.35"
          dur="2.8s"
          begin="0.45s"
          repeatCount="indefinite"/>

      </circle>


      <!-- RIGHT DOT -->

      <circle
        cx="90"
        cy="0"
        r="4">

        <animate
          attributeName="r"
          values="3;6;3"
          dur="2.8s"
          begin="0.9s"
          repeatCount="indefinite"/>

        <animate
          attributeName="opacity"
          values="0.35;1;0.35"
          dur="2.8s"
          begin="0.9s"
          repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- ================================================= -->
    <!-- DECORATIVE SCIENTIFIC LINES -->
    <!-- ================================================= -->

    <g
      stroke="#080609"
      stroke-width="2"
      opacity="0.30">

      <line
        x1="250"
        y1="505"
        x2="560"
        y2="505"/>

      <line
        x1="1040"
        y1="505"
        x2="1350"
        y2="505"/>

    </g>


    <!-- ================================================= -->
    <!-- PREMIUM BORDER -->
    <!-- ================================================= -->

    <rect
      x="12"
      y="12"
      width="1576"
      height="696"
      rx="38"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.55"
      stroke-width="2"/>


    <!-- INNER BORDER -->

    <rect
      x="22"
      y="22"
      width="1556"
      height="676"
      rx="32"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.18"
      stroke-width="1"/>

  </g>

</svg>
